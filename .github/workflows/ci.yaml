name: Python CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 08-CICD/task-1/requirements.txt

      - name: Run linting
        run: |
          cd 08-CICD/task-1
          flake8 .

      - name: Run unit tests
        run: |
          cd 08-CICD/task-1
          python -m unittest discover -s tests

      - name: Build Docker image
        run: |
          docker build -t hello-python ./08-CICD/task-1